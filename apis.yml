name: Reflex Careers
description: Reflex (Reflex Careers) is an on-demand labor platform for retail stores,
  connecting brands and store operators with vetted, background-checked associates
  for short-notice shift coverage. The platform handles employer-of-record
  responsibilities including payroll, tax withholding, and compliance, lets
  retailers post shifts with as little as two hours' notice, and uses a two-way
  review system to build worker track records and brand-specific training per shift.
  Reflex serves retail brands including Ariat, Faherty, Fossil, and Everlane and is
  backed by Canaan Partners. Added to the API Evangelist network from the Canaan
  Partners portfolio; as of this enrichment pass Reflex publishes no public API,
  developer portal, or SDKs.
